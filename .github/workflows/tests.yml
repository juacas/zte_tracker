name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v5"
      - uses: "actions/setup-python@v6"
        with:
          python-version: "3.12"

      # The release runs this same script, so a test added here always gates a release too.
      - run: .github/scripts/run_release_tests.sh
