name: HACS Action

on:
  push:
    # Branch pushes are already covered by the pull_request run, so this would only duplicate it.
    branches: [master]
  pull_request:
#  schedule:
#    - cron: "0 0 * * *"

jobs:
  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    # The release pull request runs its own HACS validation and merges before this can finish.
    if: ${{ !startsWith(github.head_ref, 'chore/release-') && !startsWith(github.ref_name, 'chore/release-') }}
    steps:
      - uses: "actions/checkout@v5"
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"
