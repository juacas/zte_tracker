name: Auto Release
run-name: "${{ inputs.dry_run && 'DRY RUN' || 'Release' }} | ${{ inputs.mode }} ${{ inputs.bump }} | ${{ inputs.auto_merge && 'auto merge' || 'manual merge' }}${{ inputs.target_sha && format(' | from {0}', inputs.target_sha) || '' }}"

on:
  # A release is never automatic: nothing here fires on a push. Someone has to start this workflow from the Actions tab.
  workflow_dispatch:
    inputs:
      bump:
        description: "Version step. From 1.2.3: patch 1.2.4, minor 1.3.0, major 2.0.0. Auto reads the commit subjects."
        required: true
        default: patch
        type: choice
        options:
          - patch
          - auto
          - minor
          - major
      auto_merge:
        # Off no longer ends the run: the job waits for your merge, so one dispatch still produces the release.
        description: "Auto merge and publish. Off: opens the pull request and waits up to 5 hours for you to merge it."
        required: false
        default: true
        type: boolean
      mode:
        description: "Mode. Stable releases v1.2.4. Existing tags never move."
        required: true
        default: stable
        type: choice
        options:
          - stable
          # rc is disabled: it tags the tree as it is, so manifest.json would still name the previous version.
          # - rc
      dry_run:
        description: "Dry run: print the plan and change nothing."
        required: false
        default: false
        type: boolean
      release_notes:
        description: "Release notes: optional text placed above the generated entries."
        required: false
        default: ""
        type: string
      target_sha:
        description: "Target commit: publish this commit as it is, without bumping. Must be master's current head."
        required: false
        default: ""
        type: string

concurrency:
  group: zte-release

permissions:
  contents: read

jobs:

  prepare:
    name: Prepare a stable release pull request
    runs-on: ubuntu-latest
    # target_sha and RC runs already have a target tree.
    if: inputs.mode == 'stable' && inputs.target_sha == ''
    permissions:
      contents: write
      pull-requests: write
    outputs:
      should_prepare: ${{ steps.plan.outputs.should_prepare }}
      next_version: ${{ steps.plan.outputs.next_version }}
      bump: ${{ steps.plan.outputs.bump }}
      merged_sha: ${{ steps.merge.outputs.merged_sha || steps.wait.outputs.merged_sha }}
      pr_url: ${{ steps.pr.outputs.pull-request-url }}
    steps:

      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Look for a release pull request left open
        id: existing
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/find_the_open_release_pull_request.sh

      - name: Work out the next version
        id: plan
        if: steps.existing.outputs.pr_number == ''
        env:
          BUMP_INPUT: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: .github/scripts/work_out_the_next_version.sh

      - name: Check release prerequisites
        if: steps.plan.outputs.should_prepare == 'true'
        env:
          AUTO_MERGE: ${{ inputs.auto_merge }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/check_release_prerequisites.sh

      - name: Report the planned release
        if: steps.plan.outputs.should_prepare == 'true' && inputs.dry_run
        env:
          BUMP: ${{ steps.plan.outputs.bump }}
          NEXT_VERSION: ${{ steps.plan.outputs.next_version }}
        run: .github/scripts/report_the_planned_release.sh

      - name: Write the manifest and changelog
        if: steps.plan.outputs.should_prepare == 'true' && !inputs.dry_run
        env:
          NEXT_VERSION: ${{ steps.plan.outputs.next_version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: .github/scripts/write_manifest_and_changelog.sh

      - name: Prepare release pull request details
        id: pr_data
        if: steps.plan.outputs.should_prepare == 'true' && !inputs.dry_run
        env:
          AUTO_MERGE: ${{ inputs.auto_merge }}
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.plan.outputs.next_version }}
        run: .github/scripts/prepare_release_pull_request_details.sh

      - name: Open the release pull request
        id: pr
        if: steps.plan.outputs.should_prepare == 'true' && !inputs.dry_run
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          token: ${{ github.token }}
          add-paths: |
            CHANGELOG.md
            custom_components/zte_tracker/manifest.json
          base: master
          branch: ${{ steps.pr_data.outputs.branch }}
          commit-message: "chore(release): prepare ${{ steps.plan.outputs.next_version }}"
          title: "chore(release): ${{ steps.plan.outputs.next_version }}"
          body-path: ${{ steps.pr_data.outputs.body_path }}
          sign-commits: true

      - name: Remove the branch when the pull request was not opened
        if: failure() && steps.pr_data.outputs.branch != '' && steps.pr.outputs.pull-request-number == ''
        # create-pull-request pushes the branch before opening the pull request, so a failure there would strand it.
        env:
          BRANCH: ${{ steps.pr_data.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" >/dev/null 2>&1 || echo "Nothing to remove."

      - name: Check out the release pull request
        id: pr_checkout
        # Validating the branch first keeps a broken tree off master, instead of bumping it and failing afterwards.
        if: >-
          (steps.pr.outputs.pull-request-number != '' || steps.existing.outputs.pr_number != '')
          && !inputs.dry_run
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.pull-request-branch || steps.existing.outputs.branch }}
          # The merge step compares history afterwards, which a shallow checkout cannot do.
          fetch-depth: 0
          # This job can write, and the steps below run third party code, so leave it no token to find.
          persist-credentials: false

      - name: Check the changelog on the release pull request
        if: steps.pr_checkout.outcome == 'success'
        env:
          VERSION: ${{ steps.plan.outputs.next_version || steps.existing.outputs.version }}
        run: .github/scripts/check_the_changelog.sh

      - name: Set up Python
        if: steps.pr_checkout.outcome == 'success'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run the tests on the release pull request
        if: steps.pr_checkout.outcome == 'success'
        run: .github/scripts/run_release_tests.sh

      - name: Run hassfest on the release pull request
        if: steps.pr_checkout.outcome == 'success'
        uses: home-assistant/actions/hassfest@master

      # HACS reads the repository through the API at the event ref, which is master, so it cannot check this
      # branch. The validate job runs it after the merge, where the token is read only.

      - name: Close the release pull request that failed validation
        # pr_checkout only succeeds if everything before it did, and the merge steps come later, so a failure
        # here can only be one of the checks above. Leaving the branch would make every retry reuse and fail on it.
        if: failure() && steps.pr_checkout.outcome == 'success'
        env:
          BRANCH: ${{ steps.pr.outputs.pull-request-branch || steps.existing.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" >/dev/null 2>&1 || true
          echo "Validation failed, so ${BRANCH} was removed and master was left alone. Fix master and start again." >&2

      - name: Check master back out
        # The merge scripts must come from master, not from whatever version opened a pull request days ago.
        if: steps.pr_checkout.outcome == 'success'
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Wait for you to merge the release pull request
        id: wait
        if: >-
          (steps.pr.outputs.pull-request-number != '' || steps.existing.outputs.pr_number != '')
          && !inputs.auto_merge
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.plan.outputs.next_version || steps.existing.outputs.version }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number || steps.existing.outputs.pr_number }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url || steps.existing.outputs.pr_url }}
          WAIT_MINUTES: "300"
        run: .github/scripts/wait_for_the_release_pull_request.sh

      - name: Merge the release pull request
        id: merge
        if: >-
          (steps.pr.outputs.pull-request-number != '' || steps.existing.outputs.pr_number != '')
          && inputs.auto_merge
        env:
          BRANCH: ${{ steps.pr.outputs.pull-request-branch || steps.existing.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          # The commit the checks above ran on. Anything pushed since must not reach master unseen.
          HEAD_SHA: ${{ steps.pr_checkout.outputs.commit }}
          NEXT_VERSION: ${{ steps.plan.outputs.next_version || steps.existing.outputs.version }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number || steps.existing.outputs.pr_number }}
        run: .github/scripts/merge_the_release_pull_request.sh

  resolve:
    name: Choose what to release
    runs-on: ubuntu-latest
    needs: prepare
    # prepare is skipped for rc and target_sha runs, which resolve on their own.
    if: >-
      always() &&
      (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      # A dry run never merges, so the tag name is still the old version: this is the one the run is really about.
      planned_version: ${{ needs.prepare.outputs.next_version }}
      changelog_version: ${{ steps.resolve.outputs.changelog_version }}
      manifest_version: ${{ steps.resolve.outputs.manifest_version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      should_tag: ${{ steps.resolve.outputs.should_tag }}
      should_publish: ${{ steps.resolve.outputs.should_publish }}
      tag_state: ${{ steps.resolve.outputs.tag_state }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
    steps:

      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Choose the release target
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          MODE: ${{ inputs.mode || 'stable' }}
          NOTES_WRITTEN: ${{ needs.prepare.outputs.should_prepare }}
          PREPARED_SHA: ${{ needs.prepare.outputs.merged_sha }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          TARGET_SHA_INPUT: ${{ inputs.target_sha || '' }}
        run: .github/scripts/choose_the_release_target.sh

  validate:
    name: Validate the release tree
    runs-on: ubuntu-latest
    needs: resolve
    if: needs.resolve.outputs.should_publish == 'true' || needs.resolve.outputs.dry_run == 'true'
    permissions:
      contents: read
    steps:

      - name: Checkout target commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}

      - name: Check the changelog
        if: needs.resolve.outputs.prerelease != 'true'
        env:
          VERSION: ${{ needs.resolve.outputs.manifest_version }}
        run: .github/scripts/check_the_changelog.sh

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run release tests
        run: .github/scripts/run_release_tests.sh

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: "integration"

  changelog:
    name: Write the tag message
    runs-on: ubuntu-latest
    needs:
      - resolve
      - validate
    if: needs.resolve.outputs.should_publish == 'true' || needs.resolve.outputs.dry_run == 'true'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changelog_entries: ${{ steps.changelog.outputs.changelog_entries }}
      tag_message: ${{ steps.changelog.outputs.tag_message }}
    steps:

      - name: Checkout target commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}
          fetch-depth: 0

      - name: Write the tag message
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG_VERSION: ${{ needs.resolve.outputs.changelog_version }}
          DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
        run: .github/scripts/write_the_tag_message.sh

  dry-run:
    name: Print the dry run summary
    runs-on: ubuntu-latest
    needs:
      - prepare
      - resolve
      - changelog
    # prepare is skipped for rc and target_sha runs, and a skipped need would skip this job too.
    if: >-
      always() &&
      (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') &&
      needs.resolve.result == 'success' &&
      needs.changelog.result == 'success' &&
      needs.resolve.outputs.dry_run == 'true'
    permissions:
      contents: read
    steps:

      - name: Checkout target commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}

      - name: Print the dry run summary
        env:
          CHANGELOG_VERSION: ${{ needs.resolve.outputs.changelog_version }}
          MANIFEST_VERSION: ${{ needs.resolve.outputs.manifest_version }}
          PLANNED_VERSION: ${{ needs.prepare.outputs.next_version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
          SHOULD_PUBLISH: ${{ needs.resolve.outputs.should_publish }}
          SHOULD_TAG: ${{ needs.resolve.outputs.should_tag }}
          TAG_MESSAGE: ${{ needs.changelog.outputs.tag_message }}
          TAG_NAME: ${{ needs.resolve.outputs.tag_name }}
          TAG_STATE: ${{ needs.resolve.outputs.tag_state }}
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
        run: .github/scripts/print_the_dry_run_summary.sh

  tag:
    # GitHub does not evaluate name: for a job it skips, so this one stays plain text.
    name: Tag the release
    runs-on: ubuntu-latest
    needs:
      - resolve
      - changelog
    if: needs.resolve.outputs.should_tag == 'true' && needs.resolve.outputs.dry_run != 'true'
    permissions:
      contents: write
    steps:

      - name: Checkout target commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}

      - name: Create the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.resolve.outputs.tag_name }}
          TAG_MESSAGE: ${{ needs.changelog.outputs.tag_message }}
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
        run: .github/scripts/create_the_release_tag.sh

  publish:
    name: Publish ${{ needs.resolve.outputs.planned_version || needs.resolve.outputs.tag_name }}
    needs:
      - resolve
      - validate
      - tag
    # Orphaned tags skip tag creation but still need release publication.
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      needs.validate.result == 'success' &&
      needs.resolve.outputs.should_publish == 'true' &&
      needs.resolve.outputs.dry_run != 'true' &&
      (needs.tag.result == 'success' ||
       (needs.tag.result == 'skipped' && needs.resolve.outputs.should_tag != 'true'))
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.resolve.outputs.tag_name }}
      prerelease: ${{ needs.resolve.outputs.prerelease == 'true' }}

  summary:
    name: ${{ needs.resolve.outputs.planned_version || needs.resolve.outputs.tag_name || 'Release' }} report
    runs-on: ubuntu-latest
    needs:
      - prepare
      - resolve
      - changelog
      - tag
      - publish
    if: always()
    permissions:
      contents: read
    steps:

      - name: Checkout master
        uses: actions/checkout@v5

      - name: Write the run summary
        env:
          CHANGELOG_ENTRIES: ${{ needs.changelog.outputs.changelog_entries }}
          DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
          INPUT_AUTO_MERGE: ${{ inputs.auto_merge }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
          MANIFEST_VERSION: ${{ needs.resolve.outputs.manifest_version }}
          PLANNED_VERSION: ${{ needs.prepare.outputs.next_version }}
          PR_URL: ${{ needs.prepare.outputs.pr_url }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          SHOULD_PUBLISH: ${{ needs.resolve.outputs.should_publish }}
          TAG_MESSAGE: ${{ needs.changelog.outputs.tag_message }}
          TAG_NAME: ${{ needs.resolve.outputs.tag_name }}
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
        run: .github/scripts/write_the_run_summary.sh
