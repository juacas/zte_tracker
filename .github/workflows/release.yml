name: Create Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to use (e.g. v2.0.7)"
        required: true
        type: string
      prerelease:
        description: "Publish the release as a prerelease."
        required: false
        default: false
        type: boolean
      draft:
        description: "Create the release as a draft so it can be inspected before publishing."
        required: false
        default: false
        type: boolean
      release_name:
        description: "Optional release title. Leave empty to use ZTE_TRACKER_<tag>."
        required: false
        default: ""
        type: string
      make_latest:
        description: "Latest-release policy. Prereleases and drafts are always forced to false."
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
          - legacy
  workflow_call:
    inputs:
      tag_name:
        description: "Tag name to publish."
        required: true
        type: string
      prerelease:
        description: "Publish the release as a prerelease."
        required: false
        type: boolean
        default: false
      draft:
        description: "Create the release as a draft so it can be inspected before publishing."
        required: false
        type: boolean
        default: false
      release_name:
        description: "Optional release title. Leave empty to use ZTE_TRACKER_<tag>."
        required: false
        type: string
        default: ""
      make_latest:
        description: "Whether this release becomes Latest. Forced to false for prereleases and drafts."
        required: false
        type: string
        default: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.tag_name || github.ref_name }}

    steps:
      - name: Checkout repository (fetch tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Prepare asset name
        run: |
          set -euo pipefail
          case "$TAG_NAME" in *[!A-Za-z0-9._-]*|"") echo "Invalid tag name." >&2; exit 1 ;; esac
          ASSET_NAME="zte_tracker-${TAG_NAME}.zip"
          echo "ASSET_NAME=${ASSET_NAME}" >> "$GITHUB_ENV"
          echo "Tag: ${TAG_NAME}"

      - name: Debug after prepare (env & git)
        run: |
          echo "=== ENV VARS ==="
          echo "TAG_NAME: ${TAG_NAME}"
          echo "ASSET_NAME: ${ASSET_NAME}"
          echo "GITHUB_REF: ${GITHUB_REF}"
          echo "GITHUB_SHA: ${GITHUB_SHA}"
          echo "github.event_name: $GITHUB_EVENT_NAME"
          echo
          echo "=== GIT INFO ==="
          git --no-pager show --summary --oneline HEAD || true
          echo "All tags (most recent first):"
          git for-each-ref --sort=-creatordate --format='%(refname:strip=2)' refs/tags | sed -n '1,10p' || true
          echo "Latest tag: $(git describe --tags --abbrev=0 2>/dev/null || echo none)"
        shell: bash

      - name: Create ZIP asset
        run: |
          set -euo pipefail
          mkdir -p dist
          # Ship only what Home Assistant imports.
          zip -r "dist/${ASSET_NAME}" custom_components/zte_tracker README.md hacs.json \
            -x "*/tests/*" "*/routers/*" "*/.vscode/*" "*/__pycache__/*" "*.pyc"
          ls -lh dist

      - name: Debug dist contents
        run: |
          echo "=== DIST CONTENTS ==="
          ls -la dist || true
          echo
          echo "Asset file details:"
          if [ -f "dist/${ASSET_NAME}" ]; then
            stat -c '%n %s bytes' "dist/${ASSET_NAME}"
          else
            echo "dist/${ASSET_NAME} missing"
          fi

      - name: Gather commits since last release
        id: changelog
        run: |
          set -e
          TAG="${TAG_NAME}"
          # This version's section only: the whole file used to be pasted in.
          CHANGELOG_CONTENT=$(awk -v tag="${TAG}" '
            function norm(s) { sub(/ +-.*$/, "", s); gsub(/[][]/, "", s); sub(/-rc\.[0-9]+$/, "", s); sub(/^v/, "", s); return s }
            /^## / {
              if (found) exit
              hdr = $0; sub(/^## +/, "", hdr)
              found = (norm(hdr) == norm(tag))
              next
            }
            found { print }
          ' CHANGELOG.md 2>/dev/null || true)
          if [ -n "$CHANGELOG_CONTENT" ]; then
            RELEASE_BODY="$CHANGELOG_CONTENT"
          else
            # No section for this tag, so describe the release with the commit subjects instead.
            PREV_TAG=$(git for-each-ref --merged "${TAG}" --sort=-creatordate --format='%(refname:strip=2)' refs/tags | grep -v "^${TAG}$" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
            if [ -n "$PREV_TAG" ]; then
              RANGE="${PREV_TAG}..${TAG}"
            else
              RANGE="${TAG}"
            fi
            BODY=$(git --no-pager log --pretty=format:'- %s (%h)' "${RANGE}" | sed '/^- chore(release): /d' || true)
            [ -z "$BODY" ] && BODY="No changes since last release"
            RELEASE_BODY=$(printf "Changes in this release:\n\n%s" "$BODY")
          fi

          # A body line reading "EOF" would close the block early.
          DELIM="EOF_$(openssl rand -hex 8)"
          {
            echo "body<<${DELIM}"
            printf "%s\n" "$RELEASE_BODY"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

          printf "%s\n" "$RELEASE_BODY" > dist/release-notes.md

      - name: Debug changelog output
        # Commit subjects are untrusted: interpolated into run, they execute.
        env:
          BODY: ${{ steps.changelog.outputs.body }}
        run: |
          echo "=== CHANGELOG OUTPUT ==="
          echo "----------------------------"
          printf '%s\n' "$BODY"
          echo "----------------------------"
        shell: bash

      - name: Debug GITHUB_TOKEN availability
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "GITHUB_TOKEN is empty. This run will fail when attempting to create a release."
            echo "Common causes: running from a fork or actions context without secrets."
            exit 1
          else
            echo "GITHUB_TOKEN present (length: ${#GITHUB_TOKEN})"
          fi
        shell: bash

      - name: Resolve release options
        id: release-options
        env:
          DRAFT: ${{ inputs.draft || false }}
          MAKE_LATEST_INPUT: ${{ inputs.make_latest || 'true' }}
          PRERELEASE: ${{ inputs.prerelease || false }}
          RELEASE_NAME_INPUT: ${{ inputs.release_name || '' }}
          TAG_PUSH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          case "$DRAFT" in true|false) ;; *) echo "Invalid draft value: $DRAFT" >&2; exit 1 ;; esac
          case "$PRERELEASE" in true|false) ;; *) echo "Invalid prerelease value: $PRERELEASE" >&2; exit 1 ;; esac

          # HACS reads the prerelease flag, not the tag spelling, so the two must never disagree.
          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAG_PRERELEASE=false
          else
            TAG_PRERELEASE=true
          fi
          if [ "$TAG_PUSH" = "true" ]; then
            PRERELEASE=$TAG_PRERELEASE
          elif [ "$PRERELEASE" != "$TAG_PRERELEASE" ]; then
            echo "prerelease=$PRERELEASE conflicts with tag $TAG_NAME." >&2
            exit 1
          fi

          release_name=$RELEASE_NAME_INPUT
          if [ -z "$release_name" ]; then
            release_name="ZTE_TRACKER_${TAG_NAME}"
          fi

          if [ "$PRERELEASE" = "true" ] || [ "$DRAFT" = "true" ]; then
            make_latest=false
          else
            case "$MAKE_LATEST_INPUT" in
              true|false|legacy) make_latest=$MAKE_LATEST_INPUT ;;
              *) echo "make_latest must be true, false, or legacy." >&2; exit 1 ;;
            esac
          fi

          delim="EOF_RELEASE_NAME_$(openssl rand -hex 8)"
          {
            printf 'release_name<<%s\n' "$delim"
            printf '%s\n' "$release_name"
            printf '%s\n' "$delim"
            printf 'draft=%s\n' "$DRAFT"
            printf 'prerelease=%s\n' "$PRERELEASE"
            printf 'make_latest=%s\n' "$make_latest"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      # Replaces actions/create-release + upload-release-asset, both archived.
      - name: Create release and upload the asset
        # The repair step below is the authority, and covers transient failures.
        continue-on-error: true
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ steps.release-options.outputs.release_name }}
          body_path: dist/release-notes.md
          draft: ${{ steps.release-options.outputs.draft }}
          prerelease: ${{ steps.release-options.outputs.prerelease }}
          make_latest: ${{ steps.release-options.outputs.make_latest }}
          files: dist/${{ env.ASSET_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the asset reached GitHub, and repair it if not
        # Success above only means the API answered. The old check was "ls dist".
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRAFT: ${{ steps.release-options.outputs.draft }}
          MAKE_LATEST: ${{ steps.release-options.outputs.make_latest }}
          PRERELEASE: ${{ steps.release-options.outputs.prerelease }}
          RELEASE_NAME: ${{ steps.release-options.outputs.release_name }}
        run: |
          set -uo pipefail
          EXPECTED=$(stat -c%s "dist/${ASSET_NAME}")
          release_flags=()
          if [ "${DRAFT}" = "true" ]; then
            release_flags+=(--draft)
          fi
          if [ "${PRERELEASE}" = "true" ]; then
            release_flags+=(--prerelease)
          fi
          case "$MAKE_LATEST" in
            true) release_flags+=(--latest) ;;
            false) release_flags+=(--latest=false) ;;
            legacy) ;;
            *) echo "Invalid make_latest value: $MAKE_LATEST" >&2; exit 1 ;;
          esac
          asset_size() {
            gh release view "${TAG_NAME}" --json assets \
              --jq ".assets[] | select(.name==\"${ASSET_NAME}\") | .size" 2>/dev/null || true
          }
          edit_flags=(
            --title "$RELEASE_NAME"
            --notes-file dist/release-notes.md
            "--draft=${DRAFT}"
            "--prerelease=${PRERELEASE}"
          )
          case "$MAKE_LATEST" in
            true) edit_flags+=(--latest) ;;
            false) edit_flags+=(--latest=false) ;;
            legacy) ;;
          esac
          for attempt in 1 2 3 4 5; do
            gh release view "${TAG_NAME}" >/dev/null 2>&1 || gh release create "${TAG_NAME}" \
              --verify-tag \
              --title "$RELEASE_NAME" --notes-file dist/release-notes.md "${release_flags[@]}" || true
            # The action above can fail after creating a release with the wrong flags, so reconcile every attempt.
            gh release edit "${TAG_NAME}" "${edit_flags[@]}" >/dev/null || true
            SIZE=$(asset_size)
            [ "${SIZE:-0}" = "${EXPECTED}" ] && { echo "Asset complete, attempt ${attempt}."; exit 0; }
            echo "Attempt ${attempt}: asset ${SIZE:-absent}, re-uploading."
            gh release upload "${TAG_NAME}" "dist/${ASSET_NAME}" --clobber || true
            sleep $((attempt * 5))
          done
          # The last upload of the loop is never seen by the checks above.
          SIZE=$(asset_size)
          [ "${SIZE:-0}" = "${EXPECTED}" ] && { echo "Asset complete after the final upload."; exit 0; }
          if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "No release exists for ${TAG_NAME} and the asset never landed." >&2
            echo "Check that the tag exists, then re-run this workflow." >&2
            exit 1
          fi
          if [ "${DRAFT}" = "true" ]; then
            echo "The draft release ${TAG_NAME} exists but its zip asset failed to attach." >&2
          else
            echo "The release ${TAG_NAME} IS published and HACS is already serving it." >&2
          fi
          echo "Only the downloadable zip asset failed to attach. Upload it by hand:" >&2
          echo "  gh release upload ${TAG_NAME} dist/${ASSET_NAME} --clobber" >&2
          exit 1
        shell: bash
