[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Both need a live router: test_client.py logs in at import time, test_zte_client.py
# in its tests. Neither was inside testpaths before, so ignoring them keeps that.
addopts = 
    --strict-markers
    --disable-warnings
    --tb=short
    -v
    --ignore=tests/zteclient/test_client.py
    --ignore=tests/zteclient/test_zte_client.py
markers =
    asyncio: marks tests as async
    unit: marks tests as unit tests
    integration: marks tests as integration tests